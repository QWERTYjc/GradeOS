<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" role="img" aria-labelledby="title desc">
  <title id="title">同一份标准，分卷并行</title>
  <desc id="desc">老师确认的同一版本分发给多份答卷。每份独立生成评分点和原页证据，再由老师复核。</desc>
  <defs>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#dbe3ed"/></pattern>
    <g id="page"><rect width="47" height="55" rx="4" fill="white" stroke="#aabbd0"/><path d="M8 15h17m-17 7h29m-29 7h23" fill="none" stroke="#b1c1d3" stroke-width="2"/><path d="m26 41 5 4 8-11" fill="none" stroke="#0759d4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8"/></g>
  </defs>
  <rect x="1" y="1" width="958" height="168" rx="12" fill="#fafbfd" stroke="#d4dde7"/>
  <rect x="232" y="10" width="493" height="149" fill="url(#grid)"/>
  <g fill="none" stroke="#0759d4" stroke-width="2.5">
    <path d="M172 85h71c37 0 39-44 81-44h73m-154 44h154m-154 0c37 0 39 44 81 44h73"/>
    <path d="M561 41h60c42 0 49 44 86 44h56m-202 0h146m-146 44h60c42 0 49-44 86-44" stroke="#9cb9df"/>
  </g>
  <g fill="#0759d4"><circle cx="242" cy="85" r="5"/><circle cx="710" cy="85" r="5"/></g>
  <rect x="43" y="43" width="130" height="85" rx="7" fill="#0759d4"/>
  <g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft Yahei',sans-serif">
    <text x="61" y="70" font-family="monospace" font-size="14" fill="#d9e8ff">RUBRIC / v1</text>
    <text x="61" y="105" font-weight="700" font-size="24" fill="white">确认标准</text>
    <g fill="#fff" stroke="#c2d0de"><rect x="395" y="25" width="167" height="32" rx="5"/><rect x="395" y="69" width="167" height="32" rx="5"/><rect x="395" y="113" width="167" height="32" rx="5"/></g>
    <g fill="#123153" font-size="17" font-weight="600"><text x="414" y="47">答卷 01</text><text x="414" y="91">答卷 02</text><text x="414" y="135">答卷 33</text></g>
    <g stroke="#0759d4" stroke-width="3" stroke-linecap="round"><path d="M505 41h38m-38 44h38m-38 44h38"/></g>
    <use href="#page" x="761" y="57"/><text x="820" y="83" fill="#182a40" font-weight="700" font-size="23">原页复核</text><text x="821" y="105" fill="#4f6075" font-size="14">理由与证据</text>
  </g>
</svg>
