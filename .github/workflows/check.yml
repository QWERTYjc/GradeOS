name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.29'
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-wqy-zenhei
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: uv sync --locked
      - run: npm run doctor
      - run: npm run check:public
