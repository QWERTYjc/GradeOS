<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>GradeOS · 分流</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fafbfd}canvas{display:block;width:min(100vw,1600px);height:auto}</style>
<canvas width="1600" height="900" aria-label="GradeOS 品牌短片：分流"></canvas>
<script type="module">
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
const logo = new Image(); logo.src = '../../docs/media/gradeos-logo-blue-white.png'; await logo.decode();
const paper='#fafbfd', blue='#0759d4', ink='#16263d', gray='#566881', pale='#d9e6f9';
const clamp = value => Math.max(0, Math.min(1,value));
const ease = value => { const unit=clamp(value); return unit*unit*(3-2*unit); };
const step = (time,start,end) => ease((time-start)/(end-start));
const between = (left,right,ratio) => left+(right-left)*ratio;
const envelope = (time,start,end) => step(time,start,start+.28)*(1-step(time,end-.26,end));
const isolated = action => {ctx.save(); action(); ctx.restore();};
const rect = (x,y,w,h,color) => {ctx.fillStyle=color;ctx.fillRect(x,y,w,h);};
function line(x,y,ex,ey,color,width=1){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}
function type(text,x,y,size,color=ink,weight=660,align='left',mono=false){
  ctx.font=`${weight} ${size}px ${mono?'Menlo, monospace':'"Helvetica Neue", "PingFang SC", sans-serif'}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(text,x,y);
}
function caption(time,start,end,action){const opacity=envelope(time,start,end);if(opacity>0) isolated(()=>{ctx.globalAlpha=opacity;ctx.translate(0,20*(1-step(time,start,start+.45))-12*step(time,end-.32,end));action();});}
function folio(mark,x,y,s,tilt,hot,detail){isolated(()=>{
  ctx.translate(x,y);ctx.rotate(tilt);ctx.scale(s,s);ctx.translate(-42,-52);
  rect(1.5,2.7,84,104,'#d5dce5');rect(0,0,84,104,'white');ctx.strokeStyle='#adc0d5';ctx.lineWidth=.72;ctx.strokeRect(0,0,84,104);
  rect(0,0,4,104,hot?blue:'#c4d6ee');type(String(mark+1).padStart(2,'0'),10,24,14,blue,700,'left',true);
  line(10,31,74,31,'#a6b7cb',.8);for(let index=0;index<4;index++){rect(10,40+index*8,31+(mark*11+index*13)%31,1.65,'#c0ccda');}
  if(detail>0){ctx.globalAlpha*=detail;rect(8.5,53,62,15,'#e2edff');type('6x − 4 = 8',11,64,8,blue,650,'left',true);ctx.globalAlpha/=detail;}
  if(hot){ctx.beginPath();ctx.moveTo(55,84);ctx.lineTo(60,89);ctx.bezierCurveTo(65,80,72,74,78,71);ctx.strokeStyle=blue;ctx.lineWidth=3.1;ctx.lineCap='round';ctx.stroke();}else{line(10,88,32,88,'#cad4e2',1.4);}
});}
const lead=16;
function positions(mark,time){
  const lane=Math.floor(mark/11), column=mark%11, seed=mark/32, angle=seed*2.3-.6;
  const float=step(time,0,1.3),spread=step(time,.45,2.6);
  const sx=between(1190+150*seed,954+seed*(132+70*spread),float), sy=between(540+seed*48,286+seed*63,float);
  const wave=step(time,2.25+.027*(32-mark),4.68+.021*(32-mark));
  const arch=Math.sin(Math.PI*wave), tx=302+87*column, ty=211+lane*136;
  const x=between(sx,tx,wave)+arch*(90*Math.cos(angle)+70*(lane-1));
  const y=between(sy,ty,wave)-arch*(135+65*Math.sin(angle*3));
  const scale=between(3.17,.76,wave), rotation=between(-.28+seed*(.23+.3*spread),0,wave)+arch*(lane-1)*.26;
  const travel=step(time,6.15+Math.abs(column-5)*.046,7.63+Math.abs(column-5)*.055);
  if(mark===lead){return [between(x,345,travel),between(y,366,travel),between(scale,3.98,travel),between(rotation,-.088,travel)];}
  return [x+(column<5?-1:1)*travel*(1020+column*45),y+(lane-1)*travel*450,scale*(1+travel*.85),rotation+(lane-1)*travel*.28];
}
function bracket(x,y,r,color){ctx.strokeStyle=color;ctx.lineWidth=2.7;for(const [dx,dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ctx.beginPath();ctx.moveTo(x+dx*(r-9),y+dy*r);ctx.lineTo(x+dx*r,y+dy*r);ctx.lineTo(x+dx*r,y+dy*(r-9));ctx.stroke();}}
function film(time){
  ctx.setTransform(1.25,0,0,1.25,0,0);ctx.globalAlpha=1;rect(0,0,1280,720,paper);
  const stamp=1-step(time,13.65,14.12);if(stamp>0) isolated(()=>{ctx.globalAlpha=stamp;type('GRADEOS   /   FIELD NOTES',55,55,14,gray,600,'left',true);type('FILM  01     /     分流',1225,55,14,gray,600,'right',true);line(56,75,1224,75,'#ced7e2');});
  caption(time,-.26,2.96,()=>{
    type('一套标准。',62,277,87,ink,780);type('33',55,465,202,blue,730);type('份答卷',302,456,57,ink,700);
    type('每份 30 页，同一份标准不必重复解释。',68,550,22,gray,520);
  });
  caption(time,3.26,6.56,()=>{
    type('分批，同时开工。',57,140,50,ink,760);
    for(let lane=0;lane<3;lane++){
      const y=211+lane*136;line(180,y,1197,y,'#c5d6eb',1.3);type('BATCH',63,y-10,13,gray,550,'left',true);type('0'+(lane+1),62,y+28,38,blue,700,'left',true);
    }
    type('同一把尺，不同答卷。',62,632,27,ink,620);type('并行分组示意  /  33 份',1210,632,16,gray,550,'right');
  });
  if(time<10.35){
    const drift=step(time,9.42,10.32);isolated(()=>{
      ctx.translate(-810*drift,60*drift);ctx.rotate(-drift*.13);
      const order=Array.from({length:33},(_,index)=>index);if(time>5.92){order.splice(lead,1);order.push(lead);}
      for(const mark of order){const [x,y,scale,rotation]=positions(mark,time);const lane=Math.floor(mark/11);const checked=time>4.51+mark%11*.118+lane*.13;folio(mark,x,y,scale,rotation,checked||mark===32&&time<3.6,mark===lead?step(time,6.6,7.72):0);}
    });
  }
  if(time>=4&&time<6.72){isolated(()=>{ctx.globalAlpha=envelope(time,4.0,6.72);for(let lane=0;lane<3;lane++){
    const y=263+lane*136,ratio=step(time,4.25+lane*.12,6.04+lane*.12);line(272,y,272+ratio*930,y,blue,3);rect(268+ratio*930,y-4,8,8,blue);
  }});}
  caption(time,7.19,9.62,()=>{
    type('17   /   33',626,213,20,blue,650,'left',true);type('分数背后，',620,321,73,ink,760);type('是原卷。',618,410,86,blue,760);
    type('老师从评分点回到作答位置，再作判断。',625,496,23,gray,500);
  });
  if(time>7.39&&time<9.56)isolated(()=>{ctx.globalAlpha=envelope(time,7.39,9.56);const reach=step(time,7.42,7.94);bracket(346,390,between(89,55,reach),blue);line(403,391,403+130*reach,391,blue,1.5);line(533,391,533+63*reach,328,blue,1.5);});
  caption(time,9.66,12.83,()=>{
    type('约一千页的模型费预算',63,173,52,ink,740);type('33 份 × 每份 30 页',1215,170,22,gray,520,'right');
    line(65,227,1214,227,'#bdcbdc');line(631,255,631,500,'#c2cedc');type('LUNA',68,302,24,gray,650,'left',true);type('TERRA',682,302,24,gray,650,'left',true);
    type('< $0.50',60,445,106,blue,740);type('≈ $3',675,445,106,ink,730);
    type('项目方预算示例，非整班实付；不含教师工时。',68,585,22,gray,510);
  });
  caption(time,12.51,14.49,()=>{
    type('本次确认的标准，',64,300,72,ink,740);type('下次和 Agent 接着用。',63,409,72,blue,740);
    type('保存版本   /   教师确认   /   再次使用',68,507,20,gray,520);
    for(let index=0;index<3;index++){const unfold=step(time,12.56+index*.11,13.43+index*.11);isolated(()=>{
      ctx.translate(1098,358);ctx.rotate(-.37);ctx.translate((index-2)*40*unfold,(index-2)*26*unfold);const edge=127;rect(-edge/2,-edge/2,edge,edge,index===2?blue:'#e3edfc');ctx.strokeStyle=index===2?blue:'#9bb9de';ctx.lineWidth=1.6;ctx.strokeRect(-edge/2,-edge/2,edge,edge);type('v'+(index+1),-48,46,24,index===2?'white':gray,600,'left',true);
    });}
  });
  for(const [begin,end,direction] of [[9.32,10.12,1],[12.32,12.94,-1]]){
    if(time>begin&&time<end){const phase=step(time,begin,end), x=direction===1?between(-335,1570,phase):between(1570,-335,phase);isolated(()=>{ctx.translate(x,0);ctx.transform(1,0,-.28,1,0,0);rect(0,0,48,720,pale);rect(56,0,176,720,blue);rect(245,0,5,720,blue);});}
  }
  if(time>=13.73){const zoom=step(time,13.73,15.10),cx=between(1098,640,zoom),cy=between(358,360,zoom);
    const size=between(127,1850,Math.pow(zoom,2));isolated(()=>{ctx.translate(cx,cy);ctx.rotate((1-zoom)*-.37);rect(-size/2,-size/2,size,size,blue);if(zoom<.24){ctx.globalAlpha=1-step(zoom,0,.24);type('v3',-48,46,24,'white',600,'left',true);}});
    const reveal=step(time,14.60,15.27);if(reveal>0)isolated(()=>{ctx.beginPath();ctx.rect(640-300*reveal,288,600*reveal,144);ctx.clip();const width=between(610,554,reveal);ctx.drawImage(logo,0,198,512,113,640-width/2,360-width*56.5/512,width,width*113/512);});
  }
}
window.frame=film;film(0);if(!location.search.includes('render')){const start=performance.now();const tick=now=>{film(((now-start)/1000)%17);requestAnimationFrame(tick);};requestAnimationFrame(tick);}
</script></html>
